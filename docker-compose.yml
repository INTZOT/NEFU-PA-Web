name: nefu-pa-web

services:
  # ---------- 反向代理 + 自动 HTTPS ----------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 .env 中设置 SITE_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # 允许反代到宿主机上的服务（二维码页用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      web:
        condition: service_healthy
    networks: [backend]

  # ---------- 数据库 ----------
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nefu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nefu_pa}
    volumes:
      # PostgreSQL 18 起，官方镜像要求挂载 /var/lib/postgresql（数据位于版本化子目录），
      # 旧的 /var/lib/postgresql/data 挂载方式在 18+ 会启动失败。
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 数据库不对外暴露端口，仅容器网络可达
    networks: [backend]

  # ---------- 网站 ----------
  # 注意：本服务**在服务器上构建会耗尽内存**（该机器仅 1.6G，且同时运行其他项目）。
  # 正确做法见 deploy.sh：先 docker build 出镜像，再 docker compose up -d（不加 --build）。
  web:
    build: ./web
    image: nefu-pa-web-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-nefu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nefu_pa}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      # 共享规则接口的访问令牌：密码加密与邀请码生成只在网站实现
      SHARED_RULES_TOKEN: ${SHARED_RULES_TOKEN:?请在 .env 中设置 SHARED_RULES_TOKEN}
      # 超管初始化用（D-23：预先指定）
      SUPER_ADMIN_QQ: ${SUPER_ADMIN_QQ:-}
      # ⚠️ 时区。**不能省** —— 容器默认是 UTC，而宿主机与所有成员都在东八区。
      #
      # 漏掉它的后果很隐蔽：`new Date("2026-10-20T15:00")`（datetime-local 的值，
      # 没有时区后缀）会被当成 UTC 解析，于是成员填「15:00」实际存成了「23:00」，
      # 页面再显示出来又是 15:00 —— 表单看着对，数据库里全错 8 小时。
      TZ: Asia/Shanghai
      # 社团照片的存放目录（D-31）。必须挂载卷，否则照片会随着镜像更新丢失。
      UPLOAD_DIR: /app/uploads
      # 机器人健康检查地址：用于管理面板显示「机器人是否在线」。
      BOT_HEALTH_URL: http://bot:8000
      # NapCat 二维码文件所在目录（只读挂载）。掉线时管理面板据此显示二维码。
      NAPCAT_QR_PATH: /app/napcat-cache/qrcode.png
      # LLBot 的二维码路径（同样只读挂载）。两个协议端的码位置不同，
      # 面板按看门狗上报的 activeService 选择读哪一个。
      LLBOT_QR_PATH: /app/llbot-cache/temp/login-qrcode.png
      # 看门狗的状态文件（只读）。面板据此显示「是否尝试过自动恢复」，
      # 以及**当前在用的是哪个协议端**（决定去哪个路径找登录二维码）。
      # 注意文件名与看门狗脚本里的一致 —— 改名过一次，这里曾忘记同步，
      # 导致面板读的是旧文件、拿不到 activeService。
      WATCHDOG_STATE_PATH: /app/watchdog-state/protocol-watchdog.json
    volumes:
      # 社团照片（D-31）：命名卷，与数据库同级别的持久化。
      # 为什么不放 web/public：那是构建进镜像的，下次部署照片会全部消失。
      - uploads_data:/app/uploads
      # NapCat 二维码：**只读**挂载 —— web 只需读取，给它写权限没有必要。
      - napcat_cache:/app/napcat-cache:ro
      # LLBot 的 data 目录：同样只读，只为读它写的登录二维码。
      - llbot_data:/app/llbot-cache:ro
      # 看门狗状态目录（由宿主机脚本写入）：同样只读，web 不该改它。
      - ./state:/app/watchdog-state:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "bin/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [backend]

  # ---------- QQ 机器人服务 ----------
  bot:
    build: ./bot
    # ⚠️ 必须显式指定镜像名。
    #
    # 只写 `build:` 时，compose 会自行生成镜像名（项目名-服务名，即 nefu-pa-web-bot），
    # 与部署流程里 `docker build -t nefu-pa-web-bot:local` 构建的名字**对不上**。
    # 后果：`docker compose up -d --force-recreate bot` 会继续复用**上一次的旧镜像**，
    # 新代码根本没被部署 —— 而且不报任何错，属于静默失败。（web 服务早已显式指定，故无此问题。）
    image: nefu-pa-web-bot:local
    restart: unless-stopped
    environment:
      # 机器人使用受限数据库账号（见 .env.example 说明）
      DATABASE_URL: postgres://${BOT_DB_USER:-nefu_bot}:${BOT_DB_PASSWORD:?请在 .env 中设置 BOT_DB_PASSWORD}@db:5432/${POSTGRES_DB:-nefu_pa}
      # 共享规则接口：密码加密与邀请码生成只在网站实现（见 docs/p3-blueprint.md 第三节）
      SHARED_RULES_URL: ${SHARED_RULES_URL:-http://web:3000/api/internal/shared-rules}
      SHARED_RULES_TOKEN: ${SHARED_RULES_TOKEN:?请在 .env 中设置 SHARED_RULES_TOKEN}
      # 注册链接用（发给用户的文案里会带上它）
      SITE_URL: ${SITE_URL:-https://nefupa.intzot.asia}
      # 反向 WebSocket 监听端口，NapCat 作为客户端连过来
      BOT_WS_PORT: "3002"
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      BOT_HEALTH_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  # ---------- QQ 协议端（二选一）----------
  #
  # 本机同时存在两套协议端实现，**同一时间只能启用一个**。
  #
  # ⚠️ 这不只是「会互相踢下线」的问题 —— 看门狗与网站面板都靠
  #    「哪个协议端容器在运行」来判断当前用的是哪一个。两个同时运行会
  #    导致判断错误（曾实测：LLBot 在等扫码、NapCat 正在服务，
  #    却被判定为 llbot，于是面板去找了一个空目录的二维码）。
  #
  #    切换时的正确顺序：先停掉正在服务的那个，再启动要用的那个。
  #
  # 为什么要两套：NapCat（跑官方 QQ 客户端）在本机实测会周期性被踢下线，
  # 而同机的 LLBot（LagrangeV2 纯协议实现，不跑 QQ 客户端）连续稳定多日。
  # 故改为以 LLBot 为主，NapCat 保留作为可随时回退的备选。
  #
  # 切换方式见 README「协议端」一节；两者的登录态各自持久化，回退只需重新启用。
  #
  # ---------- 关于「有头模式」（已弃用，保留此说明以免重蹈覆辙）----------
  #
  # LLBot 有两种连接方式（官方部署脚本原文）：
  #   direct = 无头，纯代码复刻协议（省内存）
  #   pmhq   = 有头，QQ 客户端跑在独立容器（官方称「更稳」）
  #
  # 我们**试过有头模式并放弃**，原因与结论：
  #
  #   1. 官方确实说它更稳，但代价是在容器里跑 **Electron + 完整 QQ 客户端**。
  #   2. 本机只有 1.6GB 内存 / 2 vCPU。实测：
  #        - pmhq 单独运行：内存稳定在 265~340MB，看似没问题；
  #        - **pmhq + llbot 同时运行：约 2 分钟内整台服务器失联**
  #          （load average 冲到 22.8，SSH 与网站全部超时，只能强制重启）。
  #   3. 结论：这台机器的资源撑不住有头模式。要用它需先加内存。
  #
  # 踩坑记录：**单独测 pmhq 给了虚假的安心感** —— 组合未验证就下了「能承受」的
  # 结论，结果第二次直接崩掉服务器。教训：资源评估必须测**峰值组合**，不是单个组件。
  #
  # 如将来要重新启用：恢复 pmhq 服务定义（镜像 linyuchen/pmhq，privileged，
  # qq_volume:/root/.config/QQ，PMHQ_AUTH_TOKEN），并让 llbot 设
  # PROTOCOL_MODE=pmhq / PMHQ_HOST=pmhq / PMHQ_PORT=13000。

  # ---------- 协议端：LLBot ----------
  llbot:
    # 本机拉取 Docker Hub / GitHub 均不稳定，镜像在本地构建后 docker save 传入
    image: nefu-pa-llbot:local
    # 启动前把卷里的配置恢复到镜像内的 default_config.json。
    #
    # 为什么需要：LLBot 把运行期配置写在镜像层的 /app/llbot/default_config.json，
    # 那个文件能扛 restart、但**扛不住镜像重建**。这里在每次启动时从卷恢复，
    # 使「改了配置 → 重建镜像」也不会丢。
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /app/llbot/data/config.json ]; then
          cp /app/llbot/data/config.json /app/llbot/default_config.json
        fi
        exec /startup.sh
    restart: unless-stopped
    profiles: [llbot]
    environment:
      # ⚠️ 无头模式（direct）：纯代码复刻协议，不跑 QQ 客户端。
      #
      # 设了 AUTO_LOGIN_QQ 后 startup.sh 执行：
      #   node ./llbot.js -q <QQ号>    # 首次仍需扫码，之后免扫
      # 且**每次启动都会传** —— 不像 NapCat 那样在内部重启后丢掉该参数。
      AUTO_LOGIN_QQ: ${BOT_QQ:-}
      # WebUI 端口。LLBot 默认 3080，与本机 DSH 网页界面冲突，故改到 3081。
      WEBUI_PORT: "3081"
    ports:
      # 仅绑定本机回环，不对外暴露
      - "127.0.0.1:3081:3081"
    volumes:
      # 登录态与配置（首次仍需扫码，之后靠 AUTO_LOGIN_QQ 免扫）
      # 注意：运行期配置 default_config.json 位于 /app/llbot/（镜像层），
      # 它的持久化由 entrypoint 负责从本卷恢复/回写（见 README「协议端」一节）。
      - llbot_data:/app/llbot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
    networks: [backend]

  # ---------- QQ 协议端（备选：NapCat）----------
  # 说明：NapCat 需要扫码登录，且必须挂在宿主网络才能与 QQ 服务器正常通信。
  #       因其涉及交互式登录，默认不随 compose 一起启动；
  #       首次部署请单独运行，详见 README「QQ 协议端」一节。
  napcat:
    # 本机无法直连 Docker Hub；此镜像由具备网络条件的机器 docker save 后传入（见 README）
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    profiles: [napcat]
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      # ⚠️ 这一项决定了「重启后要不要重新扫码」，非常关键。
      #
      # entrypoint.sh 的逻辑是：
      #   if [ -n "${ACCOUNT}" ]; then  qq --no-sandbox -q $ACCOUNT   # 快速登录
      #   else                          qq --no-sandbox              # 二维码登录
      #
      # 不设 ACCOUNT 时**一律走二维码登录** —— 即使快速登录凭据就在 napcat_qq 卷里。
      # 这正是「每次重建容器都要重新扫码」的原因（曾误判为登录态不能持久化）。
      #
      # 设为机器人 QQ 号即可在重启后自动快速登录，无需人工扫码。
      # 若该凭据失效（例如被服务端踢下线），QQ 仍会退化为二维码登录。
      ACCOUNT: ${BOT_QQ:-}
    ports:
      # 仅绑定本机回环，不对外暴露
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6099:6099"
    volumes:
      - napcat_config:/app/napcat/config
      - napcat_qq:/app/.config/QQ
      # 二维码文件：web 侧需要只读访问，以便在超管面板里展示（掉线时用）
      - napcat_cache:/app/napcat/cache
    # 把日志同时写到宿主机文件，供二维码服务读取（首次登录扫码用）
    logging:
      driver: json-file
      options:
        max-size: "10m"
    networks: [backend]

volumes:
  db_data:
  uploads_data: # 社团照片（D-31）
  napcat_cache: # NapCat 的二维码文件，供 web 只读读取
  llbot_data: # LLBot 的登录态与配置
  caddy_data:
  caddy_config:
  napcat_config:
  napcat_qq:

networks:
  backend:
    driver: bridge
